name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a **security** issue? Don't file it here — see
        [SECURITY.md](https://github.com/aashu2006/PARO-STUDIO/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to...
        2. Click...
        3. See error
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where did you see this?
      options:
        - On parostudios.in
        - Running locally
        - Both
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Anything in the browser devtools console. Rendered as code, no backticks needed.
      render: text
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 130 on macOS 15
    validations:
      required: false
