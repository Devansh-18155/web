version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Monthly, not weekly. Grouped minor and patch bumps are not urgent, and a
    # weekly drip is more interruption than it is worth on a small project.
    # Security updates ignore this schedule and arrive whenever they are found.
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

    # No automatic major version bumps.
    #
    # Every major we have seen needed hand work rather than a merge. React 19
    # needs react-dom and 40-odd Radix peers moved together. Vite 8 needs its
    # SWC plugin moved first. ESLint 10 needs eslint-plugin-react-hooks first.
    # lucide-react v1 renamed icons. Dependabot cannot coordinate any of that,
    # so it opens one failing PR per package, forever.
    #
    # Minor and patch updates still arrive and nearly always merge clean.
    # Security updates come from a separate Dependabot feature and are not
    # affected by this. Majors get done deliberately, tracked under Known
    # follow-ups in the README.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

    # Batch the routine noise into single PRs; security fixes still come
    # through individually and immediately.
    groups:
      radix-ui:
        patterns: ["@radix-ui/*"]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
