# Supabase CLI config.
#
# PARO does not run the local Supabase stack, so there is no [db], [auth] or
# [studio] section here and you do not need Docker. The CLI is used for two
# things only:
#
#   supabase db push          apply migrations to the linked remote project
#   supabase gen types        regenerate src/services/supabase/database.types.ts
#
# `project_id` below only names the local project. It is not the remote project
# reference. The remote you are linked to is stored in supabase/.temp/, which is
# gitignored, and is set by `supabase link`.
#
# See CONTRIBUTING.md for the schema change workflow.

project_id = "paro-studio"

[db]
# Match production. Check with `cat supabase/.temp/postgres-version` after a
# link. The CLI defaults to 15, and diffing a local 15 against a production 17
# reports version noise as if it were schema drift.
major_version = 17
port = 54322

[db.seed]
# Off on purpose. supabase/seed.sql attaches sample data to the most recently
# created account and raises if there is none, so it cannot run against a
# freshly reset database where auth.users is empty. It defaults to on, which
# would make `supabase db reset` fail every time.
#
# Run it by hand after signing up locally, the same way contributors do.
enabled = false
